trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

stages:
  - stage: BuildAndDeploy
    displayName: Build and Deploy Development Website

    jobs:
      - job: DeployStaticWebApp
        displayName: Deploy AIM Internal Website

        steps:
          - checkout: self
            clean: true

          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: '20.x'

          - script: |
              node --version
              npm --version
            displayName: Display Node and npm versions

          - task: Cache@2
            displayName: Cache npm packages
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.npm

          - script: |
              npm ci --cache $(Pipeline.Workspace)/.npm
            displayName: Install dependencies

          - script: |
              npm run build
            displayName: Build Next.js static website

          - script: |
              echo "Checking static export output..."
              test -d out
              test -f out/index.html
              echo "Static website build verified successfully."
            displayName: Verify build output

          - task: AzureStaticWebApp@0
            displayName: Deploy to Azure Static Web Apps
            inputs:
              app_location: '/'
              output_location: 'out'
              skip_app_build: true
              skip_api_build: true
              is_static_export: true
              verbose: true
              azure_static_web_apps_api_token: '$(AZURE_STATIC_WEB_APPS_API_TOKEN)'