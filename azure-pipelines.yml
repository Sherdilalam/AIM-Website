trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main


pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '20.x'

stages:
- stage: BuildAndDeploy
  displayName: Build and Deploy Development Website

  jobs:
  - job: DeployStaticWebApp
    displayName: Deploy AIM Internal Website

    steps:
    - checkout: self
      clean: true

    - task: UseNode@1
      displayName: Install Node.js
      inputs:
        version: '$(nodeVersion)'

    - script: |
        node --version
        npm --version
      displayName: Display Node and npm versions

    - task: Cache@2
      displayName: Cache npm packages
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(Pipeline.Workspace)/.npm

    - script: |
        npm ci --cache $(Pipeline.Workspace)/.npm
      displayName: Install dependencies

    - script: |
        npm run check-assets
      displayName: Check export images are present in public/

    - script: |
        npm run build
      displayName: Build Next.js static website

    - script: |
        echo "Verifying generated static website..."

        test -d out
        test -f out/index.html

        echo "Files generated in out/:"
        ls -la out | head -50

        echo "Static website verified successfully."
      displayName: Verify build output

    - task: AzureStaticWebApp@0
      displayName: Deploy to Azure Static Web Apps
      inputs:
        app_location: 'out'
        api_location: 'api'
        output_location: ''
        skip_app_build: true
        skip_api_build: false
        verbose: true
        azure_static_web_apps_api_token: '$(AZURE_STATIC_WEB_APPS_API_TOKEN)'